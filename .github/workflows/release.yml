# Release pipeline — builds the APK + packs the botd payload + publishes
# a GitHub Release with all assets.
#
# Triggers:
#   - tag: v*          (e.g. v0.1.0 → version 0.1.0)
#   - manual dispatch  (draft, non-released)
#
# Signing:
#   Provide the keystore via repo secrets:
#     PHONEBOT_KEYSTORE        (base64 of keystore file)
#     PHONEBOT_KEYSTORE_PASS
#     PHONEBOT_KEY_ALIAS
#     PHONEBOT_KEY_PASS
#   Without them, the job builds an *unsigned* APK + the botd payload and
#   uploads assets without publishing a release, so you can still grab the
#   botd tarball/manifest.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      draft:
        description: "Create a draft release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Only run on a v* tag push or a manual dispatch. GitHub auto-runs a
    # newly-introduced on:push workflow once on the adding commit even when
    # the tag filter would not match — the guard makes that no-op a clean
    # skip instead of a failed plan.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.pack.outputs.version }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle wrapper committed — bootstrap it, then use it.
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          version: 8.11.1

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1 --no-daemon
          # Persist the wrapper so future CI runs don't need re-bootstrap.
          git config user.name "phonebot-ci"
          git config user.email "ci@phonebot.local"
          git add gradle/ gradlew gradlew.bat 2>/dev/null || true
          git diff --quiet || git commit -m "ci: add gradle wrapper"

      - name: Decode signing keystore (if secrets present)
        id: sign
        run: |
          if [ -n "${{ secrets.PHONEBOT_KEYSTORE }}" ]; then
            mkdir -p signing
            echo "${{ secrets.PHONEBOT_KEYSTORE }}" | base64 -d > "signing/phonebot-release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build APK
        run: |
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease \
              -Psigning.storeFile=signing/phonebot-release.keystore \
              -Psigning.storePass="${{ secrets.PHONEBOT_KEYSTORE_PASS }}" \
              -Psigning.keyAlias="${{ secrets.PHONEBOT_KEY_ALIAS }}" \
              -Psigning.keyPass="${{ secrets.PHONEBOT_KEY_PASS }}"
            echo "APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "No keystore secrets — building unsigned APK (installable only with 'adb install -r')."
            ./gradlew --no-daemon assembleDebug
            echo "APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Copy APK into release dir
        run: |
          mkdir -p release/dist
          cp "$APK" release/dist/phonebot-$(basename "$APK")
          ls -la release/dist/

      - name: Pack botd payload + manifest
        id: pack
        run: |
          python3 -m pip install --upgrade pip >/dev/null
          VERSION="${{ github.event.inputs.version || '' }}"
          if [ -z "$VERSION" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Strip the leading v using bash parameter expansion (GITHUB_REF_NAME is
            # "v0.1.0" -> "0.1.0"). Note this is plain bash, not a workflow expression.
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [ -z "$VERSION" ] && VERSION="0.0.0-dev"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "using version: $VERSION"
          python3 release/pack.py --version "$VERSION" --sign

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phonebot-release-${{ github.run_id }}
          path: release/dist/
          retention-days: 30

  publish:
    needs: build
    # Publish only on a tag push, or on manual dispatch when the build was
    # signed (an unsigned dispatch should not ship a public release).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && needs.build.outputs.signed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phonebot-release-${{ github.run_id }}
          path: release/dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build.outputs.version }}"
          draft: ${{ (github.event_name == 'workflow_dispatch' && inputs.draft == true) || false }}
          generate_release_notes: false
          body: |
            ## Phonebot v${{ needs.build.outputs.version }}

            - **APK** — Android app (Observatory). Install over USB (`adb install`)
              or sideload.
            - **botd payload** — the Termux Python daemon. The app's Setup Wizard
              downloads this automatically and deploys it via `botd-install.sh`.
            - **manifest.json** — version pins (F-Droid APKs, SHA-256, GPG
              fingerprint). The wizard verifies these before installing anything.

            ### Quick start
            1. Install the APK.
            2. Run the Setup Wizard (auto-installs Termux + Termux:API +
               Termux:Boot from F-Droid, SHA-256 verified).
            3. Grant the OpenAI-compatible endpoint (e.g. OpenRouter) in
               Settings → Capabilities → Tools.
            4. Create your first bot from the command palette.
          files: release/dist/*
