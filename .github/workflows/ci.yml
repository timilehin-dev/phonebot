# CI gate: runs the Python-side test suite on a Linux runner.
#
# These checks are platform-independent and need NO Android SDK:
#   - protocol conformance (contract == registry == LLM schemas)
#   - tool dispatch to a real subprocess
#   - mock OpenAI plumbing (auth/payload/normalisation)
#   - botd selftest + offline smoketest
#
# The Android APK build is NOT done here (that's release.yml / Android Studio).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install botd deps
        run: pip install -r botd/requirements.txt

      - name: Selftest (botd)
        run: python -m botd.main --selftest

      - name: Protocol conformance
        run: python test/protocol_conformance.py

      - name: Tool dispatch (real subprocess)
        run: python test/tools_dispatch_check.py

      - name: Mock OpenAI plumbing
        run: python test/mock_openai_check.py

      - name: CLI cross-process round-trip (app → Termux → botd)
        run: python test/cli_roundtrip_check.py

      - name: Offline LLM smoketest
        run: python -m botd.main --smoketest-llm --llm-mode fake

      - name: Regression checks
        run: python test/regression_check.py

  android-build:
    # Compiles the APK so Kotlin/Compose/AGP breakage fails the build, not
    # just the tag-time release workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships the Android SDK and ANDROID_HOME; AGP
      # downloads any missing platform/build-tools component itself. (The
      # setup-android action has repeatedly failed on these runners, and the
      # release workflow builds without it too.)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phonebot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
